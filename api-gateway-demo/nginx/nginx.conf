events {
    worker_connections 1024;
}

http {
    upstream security_upstream {
        server security:8080;
    }

    upstream uploader_upstream {
        server uploader:8080;
    }

    upstream minio_upstream {
        server minio:9000;
    }

    # Основной server блок (это было пропущено!)
    server {
        listen 80;
        server_name localhost;

        # Внутренняя локация для проверки токена
        location = /_validate_token {
            internal;
            proxy_method GET;
            proxy_pass http://security_upstream/v1/token/validation/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # POST /v1/register -> security POST /v1/user (анонимный)
        location /v1/register {
            proxy_pass http://security_upstream/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # POST /v1/token -> security POST /v1/token (анонимный)
        location /v1/token {
            proxy_pass http://security_upstream/v1/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # GET /v1/user -> требует валидный токен, затем proxy в security
        location /v1/user {
            auth_request /_validate_token;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://security_upstream/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # POST /v1/upload -> требует валидный токен, затем proxy в uploader
        location /v1/upload {
            auth_request /_validate_token;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://uploader_upstream/v1/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            client_max_body_size 10M;
        }

        # GET /v1/user/{image} -> требует валидный токен, затем proxy в minio
        location ~ ^/v1/user/(.*)$ {
            auth_request /_validate_token;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://minio_upstream/images/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Убираем Authorization для MinIO (он не нужен, т.к. gateway уже проверил токен)
            proxy_set_header Authorization "";
        }
    }
}
