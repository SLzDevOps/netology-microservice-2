version: '3.8'

services:
  # ============================================
  # API Gateway (NGINX)
  # ============================================
  gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - security
      - uploader
      - minio
    networks:
      - internal

  # ============================================
  # Сервис Security (аутентификация, пользователи)
  # Локальная сборка из Dockerfile
  # ============================================
  security:
    build: ./security
    container_name: security-service
    environment:
      - APP_SECRET=secret-key-123
    ports:
      - "8081:8080"  # для отладки
    networks:
      - internal

  # ============================================
  # Сервис Uploader (сжатие и загрузка картинок)
  # Локальная сборка из Dockerfile
  # ============================================
  uploader:
    build: ./uploader
    container_name: uploader-service
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=images
    depends_on:
      - minio
    ports:
      - "8082:8080"  # для отладки
    networks:
      - internal

  # ============================================
  # MinIO (S3-совместимое хранилище)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: minio-storage
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Инициализация MinIO (создание бакета images)
  # ============================================
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/images;
      mc policy set download local/images;
      echo 'Bucket images created';
      exit 0;
      "
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  minio-data:
